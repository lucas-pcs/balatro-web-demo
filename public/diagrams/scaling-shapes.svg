<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1e40af" text-anchor="start" font-weight="600"><tspan x="80.0" y="57.3">Why only ×Mult / retrigger keep pace with the ante curve</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="500"><tspan x="96.0" y="107.5">score  (log scale) ↑</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="500"><tspan x="1010.0" y="463.5">rounds / antes →</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#047857" text-anchor="start" font-weight="500"><tspan x="1010.0" y="341.5">Additive +Mult — linear</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#009dff" text-anchor="start" font-weight="500"><tspan x="980.0" y="145.5">×Mult — exponential</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="start" font-weight="500"><tspan x="870.0" y="107.5">Retrigger — super-exponential</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9" text-anchor="start" font-weight="500"><tspan x="520.0" y="311.5">Ante requirement (the wall)</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" font-weight="500"><tspan x="130.0" y="512.3">On a log axis, additive growth bends flat while ×Mult and retrigger stay straight, climbing lines. Past Ante ~5</tspan><tspan x="130.0" y="533.3">the requirement outpaces every additive build — so the endgame is always a multiplicative / retrigger engine.</tspan></text>
