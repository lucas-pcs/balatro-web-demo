<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#1e40af" text-anchor="start" font-weight="600"><tspan x="80.0" y="63.0">How a hand scores:  Chips × Mult</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="start" font-weight="500"><tspan x="80.0" y="95.1">Accumulators resolve left → right. ×Mult multiplies everything already in the pot — so order is everything.</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="500"><tspan x="170.0" y="209.0">1 · Hand base</tspan><tspan x="170.0" y="226.5">chips &amp; mult @ level</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="500"><tspan x="430.0" y="201.3">2 · Played cards</tspan><tspan x="430.0" y="217.5">+chips +mult ×ed.</tspan><tspan x="430.0" y="233.8">retriggers</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="500"><tspan x="690.0" y="201.3">3 · Held cards</tspan><tspan x="690.0" y="217.5">Steel ×1.5</tspan><tspan x="690.0" y="233.8">Baron ×1.5/King</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#78350f" text-anchor="middle" font-weight="500"><tspan x="965.0" y="208.1">4 · Jokers</tspan><tspan x="965.0" y="228.1">left → right</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#065f46" text-anchor="middle" font-weight="500"><tspan x="1240.0" y="208.6">Chips × Mult</tspan><tspan x="1240.0" y="227.3">= Score</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1e40af" text-anchor="start" font-weight="500"><tspan x="740.0" y="342.3">Zoom — joker tray order (the whole game):</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="500"><tspan x="815.0" y="400.9">+Chips</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="500"><tspan x="995.0" y="400.9">+Mult</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#78350f" text-anchor="middle" font-weight="500"><tspan x="1175.0" y="400.9">×Mult</tspan></text>
<text font-family="ui-sans-serif, Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" font-weight="500"><tspan x="80.0" y="482.3">Why: a ×Mult joker multiplies the entire running Mult to its left. Put every +Chips and +Mult joker LEFT, every</tspan><tspan x="80.0" y="503.3">×Mult joker RIGHT — and a Polychrome (×1.5) on your right-most, biggest ×Mult.</tspan></text>
