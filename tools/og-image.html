<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: radial-gradient(120% 120% at 50% 0%, #20242d 0%, #16181d 60%, #101216 100%);
    font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaf0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; overflow: hidden; position: relative;
  }
  .title { font-size: 78px; font-weight: 800; letter-spacing: 0.5px; }
  .chip {
    background: #fe5f55; color: #fff; padding: 4px 22px; border-radius: 14px;
    box-shadow: 0 6px 0 #c63a31; margin-right: 14px;
  }
  .sub { margin-top: 18px; font-size: 30px; color: #9aa0ad; font-weight: 600; }
  .score { margin-top: 6px; font-size: 30px; font-weight: 800; }
  .chips { color: #009dff; } .mult { color: #fe5f55; } .eq { color: #ffd84d; }
  .cards { display: flex; gap: 26px; margin-top: 44px; }
  .card {
    width: 150px; height: 201px; border-radius: 14px;
    background-image: url(../public/jokers/Jokers.png);
    background-size: 1500px auto; background-repeat: no-repeat;
    image-rendering: pixelated; box-shadow: 0 14px 26px rgba(0,0,0,0.55);
    border: 3px solid rgba(255,255,255,0.08);
  }
  .card:nth-child(1) { transform: rotate(-9deg); }
  .card:nth-child(2) { transform: rotate(-4deg) translateY(-8px); }
  .card:nth-child(3) { transform: rotate(0deg) translateY(-14px); }
  .card:nth-child(4) { transform: rotate(4deg) translateY(-8px); }
  .card:nth-child(5) { transform: rotate(9deg); }
  .badge { position: absolute; top: 28px; right: 40px; font-size: 22px; color: #9aa0ad; font-weight: 700; }
</style>
</head>
<body>
  <div class="badge">lucas-pcs.github.io/balatro-web-demo</div>
  <div class="title"><span class="chip">Balatro</span>Pro Handbook</div>
  <div class="sub">Infinite-scaling strategy · score simulator · build tier list</div>
  <div class="score"><span class="chips">Chips</span> <span class="eq">×</span> <span class="mult">Mult</span> <span class="eq">→ ∞</span></div>
  <div class="cards">
    <div class="card" style="background-position:0px 0px"></div>
    <div class="card" style="background-position:-900px -2412px"></div>
    <div class="card" style="background-position:0px -603px"></div>
    <div class="card" style="background-position:-600px -201px"></div>
    <div class="card" style="background-position:-750px -2211px"></div>
  </div>
</body>
</html>
